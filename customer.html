<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ārāma Wellness — Feel Better Today</title>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;700;800&display=swap" rel="stylesheet">
<!-- Google GSI -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- Facebook JS SDK -->
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#16213e;--card:#1e1e30;--card2:#252540;
  --accent:#C9960A;--accent2:#E6AD0A;--accent3:#FFCC2A;
  --gold:#FFCC2A;--gold2:#FFD93D;
  --green:#10b981;--green2:#34d399;
  --red:#ef4444;--blue:#3b82f6;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --border:#2d2d45;--border2:#3d3d60;
  --radius:12px;--radius2:18px;--radius3:24px;
  --nav-h:68px;--safe-b:env(safe-area-inset-bottom,0px);
}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{min-height:100dvh;font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;overflow-x:hidden;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px)}
button,input,select,textarea{font-family:inherit;font-size:16px}
button{cursor:pointer;border:none;outline:none;-webkit-tap-highlight-color:transparent}
input,textarea{outline:none;border:2px solid var(--border2);background:var(--bg3);color:var(--text);border-radius:var(--radius);padding:14px 16px;width:100%;-webkit-appearance:none}
input:focus,textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(201,150,10,.18)}
input::placeholder{color:var(--text3)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.hidden{display:none!important}
.container{max-width:680px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:var(--radius);font-weight:700;font-size:14px;transition:transform .1s,opacity .15s;user-select:none}
.btn:active{transform:scale(.97)}
.btn-gold{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#0f0f1a}
.btn-outline{background:transparent;border:2px solid var(--border2);color:var(--text)}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--text)}
.btn-green{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:var(--green2)}
.btn-red{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px}
.btn-w{width:100%}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:20px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.badge-gold{background:rgba(201,150,10,.18);color:var(--gold2);border:1px solid rgba(201,150,10,.3)}
.badge-green{background:rgba(16,185,129,.15);color:var(--green2);border:1px solid rgba(16,185,129,.3)}
.badge-blue{background:rgba(59,130,246,.15);color:#93c5fd;border:1px solid rgba(59,130,246,.3)}
.chip{display:inline-flex;align-items:center;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;border:2px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s}
.chip.active{border-color:var(--accent2);color:var(--accent3);background:rgba(201,150,10,.12)}
/* TOP BAR */
#topBar{position:sticky;top:0;z-index:100;background:rgba(15,15,26,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;max-width:680px;margin:0 auto}
.brand-name{font-family:'Alegreya',Georgia,serif;font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--accent2),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
/* BOTTOM NAV */
#bottomNav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(15,15,26,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding-bottom:var(--safe-b)}
.nav-inner{display:flex;max-width:680px;margin:0 auto}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;font-size:10px;font-weight:600;color:var(--text3);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .2s;border:none;background:transparent}
.nav-item.active{color:var(--accent3)}
.nav-item .nav-icon{font-size:22px;line-height:1}
/* AUTH SCREEN */
#authScreen{position:fixed;inset:0;z-index:500;background:var(--bg);overflow-y:auto;padding:24px 16px 40px}
.auth-wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.auth-logo{font-family:'Alegreya',Georgia,serif;font-size:48px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;text-align:center}
.auth-tagline{font-size:14px;color:var(--text3);text-align:center;margin-bottom:28px}
.auth-box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius3);padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.auth-tabs{display:flex;gap:0;background:var(--bg3);border-radius:var(--radius);padding:4px;margin-bottom:20px}
.auth-tab{flex:1;padding:9px;border-radius:10px;font-size:14px;font-weight:600;color:var(--text3);background:transparent;border:none;cursor:pointer;transition:all .2s}
.auth-tab.active{background:var(--card2);color:var(--accent3)}
.form-label{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block}
.form-group{margin-bottom:14px}
/* SOCIAL BUTTONS */
.social-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.social-btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 12px;border-radius:10px;font-size:13px;font-weight:700;border:1px solid;cursor:pointer;transition:all .15s;width:100%}
.social-btn:active{transform:scale(.97)}
.soc-google{background:#fff;color:#3c4043;border-color:#dadce0}
.soc-facebook{background:#1877F2;color:#fff;border-color:#1877F2}
.soc-instagram{background:linear-gradient(135deg,#833AB4,#FD1D1D,#FCB045);color:#fff;border-color:transparent}
.soc-x{background:#000;color:#fff;border-color:#333}
.soc-linkedin{background:#0A66C2;color:#fff;border-color:#0A66C2}
.social-btn svg{flex-shrink:0}
.or-divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--text3);font-size:12px}
.or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.auth-footer{text-align:center;font-size:13px;color:var(--text3);margin-top:14px}
.auth-footer a{color:var(--accent3);font-weight:600}
/* LOYALTY CARD */
.loyalty-card{background:linear-gradient(135deg,#1a1208,#2a1f00,#1a1208);border:1px solid rgba(201,150,10,.4);border-radius:var(--radius2);padding:22px;position:relative;overflow:hidden}
.loyalty-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 80% 20%,rgba(201,150,10,.2),transparent 60%);pointer-events:none}
.loyalty-tier{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--accent2);text-transform:uppercase;margin-bottom:4px}
.loyalty-pts{font-size:38px;font-weight:900;font-family:'Alegreya',Georgia,serif;background:linear-gradient(135deg,var(--accent2),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
.loyalty-bar-wrap{margin-top:12px;background:rgba(201,150,10,.15);border-radius:4px;height:6px;overflow:hidden}
.loyalty-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold2));border-radius:4px;transition:width .6s}
/* SERVICE CARDS */
.service-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.svc-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:16px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.svc-card:active{transform:scale(.98)}
.svc-card.selected{border-color:var(--accent2);background:rgba(201,150,10,.08)}
.svc-badge{position:absolute;top:10px;right:10px;background:rgba(16,185,129,.2);border:1px solid rgba(16,185,129,.4);border-radius:6px;font-size:10px;font-weight:700;color:var(--green2);padding:2px 6px}
/* PASS CARDS */
.pass-card{border-radius:var(--radius2);padding:18px;margin-bottom:12px;position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.pass-card:active{transform:scale(.98)}
.pass-bronze{background:linear-gradient(135deg,#2d1f0e,#4a3115);border:1px solid rgba(176,114,46,.5)}
.pass-silver{background:linear-gradient(135deg,#1e2233,#2d3250);border:1px solid rgba(148,163,184,.4)}
.pass-gold{background:linear-gradient(135deg,#1a1208,#2e1f00);border:1px solid rgba(201,150,10,.5)}
.pass-platinum{background:linear-gradient(135deg,#0d1a2d,#1a2d4a);border:1px solid rgba(139,92,246,.5)}
/* REFERRAL */
.referral-card{background:linear-gradient(135deg,#0d1a0d,#112211);border:1px solid rgba(16,185,129,.3);border-radius:var(--radius2);padding:20px}
.ref-code{font-size:26px;font-weight:900;font-family:monospace;letter-spacing:6px;color:var(--green2);text-align:center;padding:14px;background:rgba(16,185,129,.08);border-radius:var(--radius);border:1px solid rgba(16,185,129,.2);cursor:pointer;user-select:all;margin:12px 0}
/* MISC */
.progress-bar{height:8px;border-radius:4px;background:var(--bg3);overflow:hidden}
.progress-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent3));transition:width .6s}
.section-title{font-size:20px;font-weight:800;margin-bottom:4px}
.section-sub{font-size:13px;color:var(--text2);margin-bottom:16px}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:16px}
.chip-row::-webkit-scrollbar{display:none}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent3));display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#0f0f1a;flex-shrink:0}
/* OTP POPUP */
#otpOverlay{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.8);backdrop-filter:blur(8px)}
.otp-popup{background:var(--card);border:1px solid rgba(201,150,10,.4);border-radius:var(--radius3);padding:28px 24px;max-width:360px;width:90%;text-align:center}
.otp-display{font-size:42px;font-weight:900;font-family:monospace;letter-spacing:10px;color:var(--gold2);padding:18px;background:rgba(201,150,10,.08);border:2px dashed rgba(201,150,10,.4);border-radius:var(--radius2);margin:14px 0}
/* TOAST */
#toastWrap{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:900;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:8px;width:90%;max-width:360px}
.toast{padding:11px 18px;border-radius:30px;font-size:13px;font-weight:600;animation:toastIn .25s ease,toastOut .3s ease 2.2s forwards;text-align:center}
.toast-success{background:rgba(16,185,129,.92);color:#fff}
.toast-error{background:rgba(239,68,68,.92);color:#fff}
.toast-info{background:rgba(201,150,10,.92);color:#0f0f1a}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
/* PROVIDER SETUP MODAL */
.setup-step{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.setup-num{width:24px;height:24px;border-radius:50%;background:rgba(201,150,10,.2);color:var(--accent3);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>
<body>

<div id="toastWrap"></div>

<!-- OTP OVERLAY -->
<div id="otpOverlay" class="hidden">
  <div class="otp-popup">
    <div style="font-size:32px;margin-bottom:8px">🔐</div>
    <div style="font-size:18px;font-weight:800;margin-bottom:4px">Your OTP</div>
    <div style="font-size:13px;color:var(--text3)" id="otpSubtext">Show this to your ārāma therapist</div>
    <div class="otp-display" id="otpCode">------</div>
    <div style="font-size:12px;color:var(--text3)" id="otpTimer">Expires in 5:00</div>
    <button class="btn btn-gold btn-w" style="margin-top:14px" onclick="closeOTP()">Got it ✓</button>
  </div>
</div>

<!-- AUTH SCREEN -->
<div id="authScreen">
  <div class="auth-wrap">
    <div class="auth-logo">ārāma</div>
    <div class="auth-tagline">पहले luxury था, अब ज़रूरी है</div>
    <div class="auth-box">
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchAuthTab('login')">Sign In</button>
        <button class="auth-tab" onclick="switchAuthTab('register')">Register</button>
      </div>

      <!-- ── SOCIAL BUTTONS ── -->
      <div id="socialBtns">
        <!-- Row 1: Google full width -->
        <div id="gsi_btn" style="display:flex;justify-content:center;margin-bottom:8px"></div>
        <button class="social-btn soc-google btn-w" onclick="triggerGoogle()" style="margin-bottom:8px">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.2l6.7-6.7C35.7 2.4 30.2 0 24 0 14.6 0 6.6 5.5 2.7 13.5l7.8 6C12.4 13.4 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.9-10 6.9-17z"/><path fill="#FBBC05" d="M10.5 28.5c-.5-1.5-.8-3-.8-4.5s.3-3 .8-4.5l-7.8-6C1 16.5 0 20.1 0 24s1 7.5 2.7 10.5l7.8-6z"/><path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.2 0-11.6-4-13.5-9.5l-7.8 6C6.6 42.5 14.6 48 24 48z"/></svg>
          Continue with Google
        </button>
        <!-- Row 2: 2-column grid -->
        <div class="social-grid">
          <button class="social-btn soc-facebook" onclick="socialLogin('facebook')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.792-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.514c-1.491 0-1.956.93-1.956 1.883v2.271h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
            Facebook
          </button>
          <button class="social-btn soc-instagram" onclick="socialLogin('instagram')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
            Instagram
          </button>
          <button class="social-btn soc-linkedin" onclick="socialLogin('linkedin')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
            LinkedIn
          </button>
          <button class="social-btn soc-x" onclick="socialLogin('x')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.736l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
            X (Twitter)
          </button>
        </div>
      </div>

      <div class="or-divider">or use phone / email</div>

      <!-- LOGIN FORM -->
      <div id="tabLogin">
        <div class="form-group">
          <label class="form-label">Phone / Email</label>
          <input id="loginId" type="text" placeholder="9876543210 or email@example.com" autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input id="loginPass" type="password" placeholder="Your password" autocomplete="current-password">
        </div>
        <button class="btn btn-gold btn-w" onclick="doLogin()">Sign In →</button>
        <div class="auth-footer"><a href="#" onclick="openForgotPass();return false">Forgot password?</a> &nbsp;·&nbsp; <a href="#" onclick="switchAuthTab('register');return false">Register</a></div>
      </div>

      <!-- REGISTER FORM -->
      <div id="tabRegister" class="hidden">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
          <div class="form-group" style="margin-bottom:0"><label class="form-label">First Name</label><input id="reg_first" type="text" placeholder="Priya"></div>
          <div class="form-group" style="margin-bottom:0"><label class="form-label">Last Name</label><input id="reg_last" type="text" placeholder="Sharma"></div>
        </div>
        <div class="form-group"><label class="form-label">Mobile</label><input id="reg_phone" type="tel" placeholder="10-digit number" maxlength="10"></div>
        <div class="form-group"><label class="form-label">Email (optional)</label><input id="reg_email" type="email" placeholder="you@example.com"></div>
        <div class="form-group"><label class="form-label">Password</label><input id="reg_pass" type="password" placeholder="Min 6 characters"></div>
        <button class="btn btn-gold btn-w" onclick="doRegister()">Create Account →</button>
        <div class="auth-footer">Have an account? <a href="#" onclick="switchAuthTab('login');return false">Sign In</a></div>
      </div>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
  <div id="topBar">
    <div class="topbar-inner">
      <div class="brand-name">ārāma</div>
      <div style="display:flex;align-items:center;gap:10px">
        <div id="topPts" style="font-size:13px;font-weight:700;color:var(--accent3)"></div>
        <div id="topAvatar" class="avatar" style="width:36px;height:36px;font-size:14px;cursor:pointer" onclick="navigate('me')"></div>
      </div>
    </div>
  </div>
  <div id="content"></div>
  <div id="bottomNav">
    <div class="nav-inner">
      <button class="nav-item active" data-tab="home" onclick="navigate('home')"><span class="nav-icon">🏠</span><span>Home</span></button>
      <button class="nav-item" data-tab="book" onclick="navigate('book')"><span class="nav-icon">📅</span><span>Book</span></button>

// PKCE helpers (for X and LinkedIn)
function generateRandomString(len=64){
  const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  const arr=new Uint8Array(len);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>chars[b%chars.length]).join('');
}
async function sha256(plain){
  const enc=new TextEncoder();
  const data=enc.encode(plain);
  const hash=await crypto.subtle.digest('SHA-256',data);
  return hash;
}
function base64urlEncode(arr){
  return btoa(String.fromCharCode(...new Uint8Array(arr))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}
async function buildPKCE(){
  const verifier=generateRandomString(64);
  const hashed=await sha256(verifier);
  const challenge=base64urlEncode(hashed);
  return{verifier,challenge};
}
function getRedirectUri(){return window.location.origin+window.location.pathname;}

async function xLogin(){
  if(!SOCIAL.x.clientId){showSetupGuide('x');return;}
  const{verifier,challenge}=await buildPKCE();
  const state=generateRandomString(16);
  sessionStorage.setItem('_pkce_verifier',verifier);
  sessionStorage.setItem('_pkce_state',state);
  sessionStorage.setItem('_pkce_provider','x');
  const params=new URLSearchParams({
    response_type:'code',
    client_id:SOCIAL.x.clientId,
    redirect_uri:getRedirectUri(),
    scope:'tweet.read users.read offline.access',
    state,
    code_challenge:challenge,
    code_challenge_method:'S256'
  });
  window.location.href='https://twitter.com/i/oauth2/authorize?'+params.toString();
}

async function handleXCallback(code,state){
  const storedState=sessionStorage.getItem('_pkce_state');
  const verifier=sessionStorage.getItem('_pkce_verifier');
  if(state!==storedState){toast('X login failed: state mismatch','error');return;}
  try{
    // X supports public client PKCE — no client_secret needed
    const resp=await fetch('https://api.twitter.com/2/oauth2/token',{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({
        code,grant_type:'authorization_code',
        client_id:SOCIAL.x.clientId,
        redirect_uri:getRedirectUri(),
        code_verifier:verifier,
        client_type:'public_client'
      })
    });
    const data=await resp.json();
    if(!data.access_token){toast('X login failed','error');return;}
    // Get user info
    const me=await fetch('https://api.twitter.com/2/users/me?user.fields=name,profile_image_url',{
      headers:{Authorization:'Bearer '+data.access_token}
    }).then(r=>r.json());
    const u=me.data||{};
    handleSocialCallback('x',{email:'',name:u.name||u.username||'',avatar:u.profile_image_url||'',sub:'x_'+u.id});
  }catch(e){toast('X token exchange failed. Check CORS / redirect URI settings.','error');}
}

function cleanOAuthParams(){
  // Remove oauth params from URL without reload
  const url=new URL(window.location.href);

  url.searchParams.delete('error');
  window.history.replaceState({},'',url.toString());
  sessionStorage.removeItem('_pkce_verifier');
  sessionStorage.removeItem('_pkce_state');
  sessionStorage.removeItem('_pkce_provider');
}

    <div class="form-group"><label class="form-label">Phone / Email</label><input id="fp_id" type="text" placeholder="Registered phone or email"></div>
    <div id="fp_step2" class="hidden">
      <div class="form-group"><label class="form-label">OTP (shown on screen)</label><input id="fp_otp" type="number"></div>
      <div class="form-group"><label class="form-label">New Password</label><input id="fp_np" type="password" placeholder="Min 6 characters"></div>
    </div>`,
  `<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
   <button class="btn btn-gold" id="fpBtn" onclick="sendForgotOTP()">Send OTP</button>`);
}
function sendForgotOTP(){
  const id=document.getElementById('fp_id')?.value.trim();
  if(!id){toast('Enter your phone or email','error');return;}
  const cust=(CDB.get('customers')||[]).find(c=>c.phone===id||c.email?.toLowerCase()===id.toLowerCase());
  if(!cust){toast('No account found','error');return;}
  _frOTP=String(Math.floor(100000+Math.random()*900000));
  sessionStorage.setItem('_frOTP',_frOTP);sessionStorage.setItem('_frUID',cust.id);
  showOTP(_frOTP,'Your password reset OTP — valid 5 minutes');
  document.getElementById('fp_step2').classList.remove('hidden');
  document.getElementById('fpBtn').textContent='Reset Password';
  document.getElementById('fpBtn').onclick=submitForgotPass;
}
function submitForgotPass(){
  const otp=document.getElementById('fp_otp')?.value.trim();
  const np=document.getElementById('fp_np')?.value;
  if(otp!==sessionStorage.getItem('_frOTP')){toast('Wrong OTP','error');return;}
  if(!np||np.length<6){toast('Password too short','error');return;}
  const customers=CDB.get('customers')||[];
  const idx=customers.findIndex(c=>c.id===sessionStorage.getItem('_frUID'));
  if(idx>=0){customers[idx].password=np;CDB.set('customers',customers);}
  sessionStorage.removeItem('_frOTP');sessionStorage.removeItem('_frUID');
  closeModal();closeOTP();
  toast('Password reset! Sign in with your new password.','success',3000);
}

function navigate(tab){
  currentTab=tab;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  const content=document.getElementById('content');
  content.innerHTML='';
  if(tab==='home')renderHome();
  else if(tab==='book')renderBook();
  else if(tab==='passes')renderPasses();
  else if(tab==='history')renderHistory();
  else if(tab==='me')renderMe();
  window.scrollTo(0,0);updateTopBar();
}

function selectDate(el,date){
  el.closest('#modal').querySelectorAll('.slot-btn').forEach(b=>{if(['09:00','09:30','10:00'].some(t=>b.textContent.trim()===t)||b.querySelector('div'))b.style.borderColor='var(--border2)';});
  el.style.borderColor='var(--accent2)';el.style.background='rgba(201,150,10,.12)';el.style.color='var(--accent3)';
  bookingState.date=date;
}
function selectTime(el,time){
  el.closest('#modal').querySelectorAll('.slot-btn').forEach(b=>{if(!b.querySelector('div')){b.style.borderColor='var(--border2)';b.style.background='var(--bg3)';b.style.color='var(--text)';}});
  el.style.borderColor='var(--accent2)';el.style.background='rgba(201,150,10,.12)';el.style.color='var(--accent3)';
  bookingState.time=time;
}

function confirmBooking(){
  const loc=document.getElementById('bk_loc')?.value;
  if(!loc){toast('Select a location','error');return;}
  if(!bookingState.date){toast('Select a date','error');return;}
  if(!bookingState.time){toast('Select a time slot','error');return;}
  const u=getFreshUser();if(!u)return;
  const svc=bookingState.service;
  const booking={id:'bk'+Date.now(),custId:u.id,custName:u.name,serviceId:svc.id,serviceName:svc.name,price:svc.price,location:loc,datetime:bookingState.date+'T'+bookingState.time+':00',status:'confirmed',createdAt:new Date().toISOString()};
  const bookings=CDB.get('bookings')||[];bookings.push(booking);CDB.set('bookings',bookings);
  const earnPts=Math.floor(svc.price*0.1);
  const customers=CDB.get('customers')||[];
  const idx=customers.findIndex(c=>c.id===u.id);
  if(idx>=0){customers[idx].loyaltyPts=(customers[idx].loyaltyPts||0)+earnPts;customers[idx].loyaltyHistory=customers[idx].loyaltyHistory||[];customers[idx].loyaltyHistory.push({type:'earn',pts:earnPts,desc:'Booking: '+svc.name,date:new Date().toISOString()});CDB.set('customers',customers);currentUser=customers[idx];}
  closeModal();toast(`Booked! ✅ +${earnPts} pts earned`,'success',3500);navigate('history');
}

function activatePass(passId){
  const pass=PASSES.find(p=>p.id===passId);const u=getFreshUser();if(!u||!pass)return;
  const customers=CDB.get('customers')||[];const idx=customers.findIndex(c=>c.id===u.id);if(idx<0)return;
  const expiry=new Date(Date.now()+pass.validity*86400000).toISOString();
  const np={id:'up'+Date.now(),passId:pass.id,name:pass.name,sessions:pass.sessions,remaining:pass.sessions,expiry,purchasedAt:new Date().toISOString()};
  customers[idx].passes=customers[idx].passes||[];customers[idx].passes.push(np);
  customers[idx].loyaltyPts=(customers[idx].loyaltyPts||0)+pass.pts;
  customers[idx].loyaltyHistory=customers[idx].loyaltyHistory||[];
  customers[idx].loyaltyHistory.push({type:'earn',pts:pass.pts,desc:'Pass: '+pass.name,date:new Date().toISOString()});
  CDB.set('customers',customers);currentUser=customers[idx];
  closeModal();
  showOTP(String(Math.floor(100000+Math.random()*900000)),'Show this OTP to staff to activate your '+pass.name);
  toast('Show OTP to kiosk staff to activate your pass!','success',4000);
}

          <div style="width:44px;height:44px;background:rgba(201,150,10,.1);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">${svc.icon}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700">${svc.name}</div>
            <div style="font-size:11px;color:var(--text3)">📍 ${b.location||'ārāma Kiosk'}</div>
            <div style="font-size:11px;color:var(--text3)">${new Date(b.datetime).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})} · ${formatTime(b.datetime)}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:14px;font-weight:800;color:var(--accent3)">₹${b.price||0}</div>
            <span class="badge ${b.status==='confirmed'?'badge-green':'badge-gold'}" style="font-size:10px">${past&&b.status==='confirmed'?'Done':b.status==='confirmed'?'Upcoming':'Pending'}</span>
          </div>
        </div>
        ${past&&b.status==='confirmed'&&!b.reviewed?`<button onclick="openReview('${b.id}')" style="margin-top:8px;width:100%;padding:8px;border-radius:8px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer">⭐ Leave a Review (+25 pts)</button>`:''}
        ${b.reviewed?`<div style="margin-top:6px;font-size:11px;color:var(--text3)">⭐ Reviewed · Thank you!</div>`:''}
      </div>`;}).join('')}
    </div>`}
  </div>`;
}

function openReview(bId){
  sessionStorage.setItem('_rev_rating','5');
  openModal('Leave a Review',`
  <div style="text-align:center;margin-bottom:18px">
    <div style="font-size:13px;color:var(--text2);margin-bottom:14px">How was your session?</div>
    <div style="display:flex;gap:8px;justify-content:center;font-size:28px" id="starRow">
      ${[1,2,3,4,5].map(i=>`<span style="cursor:pointer;transition:transform .1s" onclick="setRating(${i})">⭐</span>`).join('')}
    </div>
  </div>
  <textarea id="rv_text" placeholder="Share your experience (optional)..." style="height:90px;resize:none"></textarea>`,
  `<button class="btn btn-outline" onclick="closeModal()">Cancel</button>
   <button class="btn btn-gold" onclick="submitReview('${bId}')">Submit ⭐</button>`);
}
function setRating(n){sessionStorage.setItem('_rev_rating',n);document.querySelectorAll('#starRow span').forEach((s,i)=>s.style.opacity=i<n?'1':'.3');}
function submitReview(bId){
  const rating=parseInt(sessionStorage.getItem('_rev_rating')||'5');
  const text=document.getElementById('rv_text')?.value.trim()||'';
  const bookings=CDB.get('bookings')||[];const idx=bookings.findIndex(b=>b.id===bId);
  if(idx>=0){bookings[idx].reviewed=true;bookings[idx].rating=rating;bookings[idx].reviewText=text;CDB.set('bookings',bookings);}
  const u=getFreshUser();const customers=CDB.get('customers')||[];const cidx=customers.findIndex(c=>c.id===u?.id);
  if(cidx>=0){customers[cidx].loyaltyPts=(customers[cidx].loyaltyPts||0)+25;customers[cidx].loyaltyHistory=customers[cidx].loyaltyHistory||[];customers[cidx].loyaltyHistory.push({type:'earn',pts:25,desc:'Review submitted',date:new Date().toISOString()});CDB.set('customers',customers);currentUser=customers[cidx];}
  closeModal();toast('Thank you! ⭐ +25 pts','success',3000);renderHistory();
}

// ══════════════════════════════════════════
// ME
// ══════════════════════════════════════════
function renderMe(){
  const u=getFreshUser();if(!u)return;
  const tier=getTier(u.loyaltyPts||0);
  const nextTier=TIERS.find(t=>t.min>(u.loyaltyPts||0));
  const hist=(u.loyaltyHistory||[]).slice().reverse().slice(0,6);
  document.getElementById('content').innerHTML=`
  <div class="container" style="padding-top:16px;padding-bottom:16px">
    <!-- PROFILE -->
    <div class="card" style="margin-bottom:14px;text-align:center;padding:24px 18px">
      <div style="width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent3));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#0f0f1a;margin:0 auto 12px">${getInitials(u.name)}</div>
      <div style="font-size:19px;font-weight:800;margin-bottom:3px">${u.name}</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:8px">${u.phone||u.email||u.socialProvider||'—'}</div>
      <div style="display:inline-flex;align-items:center;gap:6px;background:rgba(201,150,10,.12);border:1px solid rgba(201,150,10,.3);border-radius:20px;padding:5px 14px">
        <span>${tier.icon}</span><span style="font-size:12px;font-weight:700;color:var(--accent3)">${tier.name} Member</span>
      </div>
      ${u.socialProvider?`<div style="margin-top:8px;font-size:11px;color:var(--text3)">Signed in via ${u.socialProvider.charAt(0).toUpperCase()+u.socialProvider.slice(1)}</div>`:''}
    </div>
    <!-- LOYALTY -->
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:15px;font-weight:800;margin-bottom:12px">⭐ Loyalty Points</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div><div style="font-size:32px;font-weight:900;color:var(--accent3)">${(u.loyaltyPts||0).toLocaleString('en-IN')}</div><div style="font-size:11px;color:var(--text3)">Total points</div></div>
        <div style="text-align:right"><div style="font-size:15px;font-weight:700">≈ ₹${Math.floor((u.loyaltyPts||0)/10)}</div><div style="font-size:11px;color:var(--text3)">Redeem value</div></div>
      </div>
      ${nextTier?`<div class="loyalty-bar-wrap" style="margin-bottom:6px"><div class="loyalty-bar" style="width:${Math.min(100,((u.loyaltyPts||0)-tier.min)/(nextTier.min-tier.min)*100)}%"></div></div><div style="font-size:11px;color:var(--text3)">${nextTier.min-(u.loyaltyPts||0)} pts to ${nextTier.icon} ${nextTier.name}</div>`:''}
      ${hist.length>0?`<div style="margin-top:14px">${hist.map(h=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:12px"><div><div style="font-weight:600">${h.desc}</div><div style="font-size:10px;color:var(--text3)">${formatDate(h.date)}</div></div><div style="font-weight:700;color:${h.type==='earn'?'var(--green2)':'var(--red)'}"><span>${h.type==='earn'?'+':'-'}${h.pts} pts</span></div></div>`).join('')}</div>`:''}
    </div>
    <!-- REFERRAL -->
    <div class="referral-card" style="margin-bottom:14px">
      <div style="font-size:15px;font-weight:800;margin-bottom:4px;color:var(--green2)">🎁 Refer & Earn</div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:4px">Both you and your friend get 200 pts when they register!</div>
      <div class="ref-code" onclick="copyRefCode()">${u.referralCode||'ARA'+u.id.slice(-5).toUpperCase()}</div>
      <div style="font-size:11px;color:var(--text3);text-align:center;margin-bottom:12px">Tap to copy</div>
      <button class="btn btn-green btn-w" onclick="shareReferral()">💬 Share on WhatsApp</button>
    </div>
    <!-- EDIT PROFILE -->
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:15px;font-weight:800;margin-bottom:12px">✏️ Edit Profile</div>
      <div class="form-group"><label class="form-label">Name</label><input id="pf_name" value="${u.name}" type="text"></div>
      <div class="form-group"><label class="form-label">Phone</label><input id="pf_phone" value="${u.phone||''}" type="tel"></div>
      <div class="form-group"><label class="form-label">Email</label><input id="pf_email" value="${u.email||''}" type="email"></div>
      ${u.socialProvider?'':`<div class="form-group"><label class="form-label">New Password</label><input id="pf_pass" type="password" placeholder="Leave blank to keep"></div>`}
      <button class="btn btn-gold btn-w" onclick="saveProfile()">Save Changes</button>
    </div>
    <!-- SIGN OUT -->
    <button class="btn btn-red btn-w" style="margin-bottom:6px" onclick="logout()">Sign Out</button>
    <div style="font-size:11px;color:var(--text3);text-align:center;padding:6px">ārāma Wellness · <a href="mailto:care@arama.asia" style="color:var(--accent3)">care@arama.asia</a></div>
  </div>`;
}

function saveProfile(){
  const name=document.getElementById('pf_name')?.value.trim();
  if(!name){toast('Name required','error');return;}
  const customers=CDB.get('customers')||[];const idx=customers.findIndex(c=>c.id===currentUser?.id);if(idx<0)return;
  const pass=document.getElementById('pf_pass')?.value;
  customers[idx]={...customers[idx],name,phone:document.getElementById('pf_phone')?.value.trim()||customers[idx].phone,email:document.getElementById('pf_email')?.value.trim()||customers[idx].email,...(pass?{password:pass}:{})};
  CDB.set('customers',customers);currentUser=customers[idx];
  toast('Profile saved!','success');updateTopBar();
}


function copyRefCode(){
  const u=getFreshUser();const code=u?.referralCode||'';
  navigator.clipboard?.writeText(code).then(()=>toast('Referral code copied!','success')).catch(()=>toast(code,'info',4000));
}
function shareReferral(){
  const u=getFreshUser();const code=u?.referralCode||'';
  const msg=encodeURIComponent('Hey! Try ārāma Wellness kiosks — quick massages inside malls, starts ₹80! 💆\n\nUse my code *'+code+'* to get 200 bonus pts when you register!\n\n'+window.location.href.split('?')[0]);
  window.open('https://wa.me/?text='+msg,'_blank');
}
function openReferral(){
  const u=getFreshUser();const code=u?.referralCode||'ARA'+u?.id?.slice(-5).toUpperCase();
  openModal('🎁 Refer & Earn',`
  <div style="text-align:center;padding:8px 0">
    <div style="font-size:44px;margin-bottom:10px">🎁</div>
    <div style="font-size:18px;font-weight:800;margin-bottom:6px">Invite friends, earn together!</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:18px">You both get <strong style="color:var(--accent3)">200 wellness pts</strong> — enough for a free session!</div>
    <div class="ref-code" onclick="copyRefCode()" style="font-size:28px;letter-spacing:8px">${code}</div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:16px">Tap code to copy</div>
    <button class="btn btn-green btn-w" onclick="shareReferral()">💬 Share on WhatsApp</button>
  </div>`,
  `<button class="btn btn-outline btn-w" onclick="closeModal()">Close</button>`);
}

// ══════════════════════════════════════════
// OAUTH CALLBACK HANDLER
// ══════════════════════════════════════════
async function handleOAuthCallback(){
  const params=new URLSearchParams(window.location.search);
  const code=params.get('code');
  const state=params.get('state');
  const error=params.get('error');
  if(error){toast('Social login cancelled','info');cleanOAuthParams();return;}
  if(!code||!state)return;
  const provider=sessionStorage.getItem('_pkce_provider');
  if(provider==='x')await handleXCallback(code,state);
  else if(provider==='linkedin')await handleLinkedinCallback(code,state);
  else cleanOAuthParams();
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
document.addEventListener('DOMContentLoaded',async()=>{
  // Handle OAuth redirect callbacks first
  await handleOAuthCallback();
  // Check ref in URL
  const params=new URLSearchParams(window.location.search);
  const ref=params.get('ref');
  if(ref){sessionStorage.setItem('_reg_ref',ref);switchAuthTab('register');}
  // Init Google Auth
  const initG=()=>{if(typeof google!=='undefined')initGoogleAuth();else setTimeout(initG,500);};
  initG();
  // Check existing session
  checkSession();
});
</script>
