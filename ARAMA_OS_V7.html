<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<title>ārāma Wellness OS v7</title>
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f1a;--bg2:#1a1a2e;--bg3:#16213e;--bg4:#0d1117;
  --card:#1e1e30;--card2:#252540;
  --accent:#7c3aed;--accent2:#9d5cf6;--accent3:#b78bfa;
  --gold:#f59e0b;--gold2:#fbbf24;
  --green:#10b981;--green2:#34d399;
  --red:#ef4444;--red2:#f87171;
  --blue:#3b82f6;--blue2:#60a5fa;
  --orange:#f97316;--orange2:#fb923c;
  --teal:#14b8a6;--teal2:#2dd4bf;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --border:#2d2d4a;--border2:#3d3d5c;
  --sidebar:220px;
  --radius:10px;--radius2:16px;
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --shadow2:0 8px 40px rgba(0,0,0,0.6);
}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:var(--accent3);text-decoration:none}
button{cursor:pointer;border:none;outline:none;font-family:inherit}
input,select,textarea{font-family:inherit;outline:none;border:1px solid var(--border2);background:var(--bg3);color:var(--text);border-radius:var(--radius);padding:8px 12px;width:100%;font-size:14px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,58,237,0.2)}
select option{background:var(--bg2)}
textarea{resize:vertical;min-height:80px}
label{display:block;margin-bottom:4px;color:var(--text2);font-size:12px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase}
h1{font-size:22px;font-weight:700;color:var(--text)}
h2{font-size:18px;font-weight:600;color:var(--text)}
h3{font-size:15px;font-weight:600;color:var(--text)}
h4{font-size:13px;font-weight:600;color:var(--text2)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
/* ─── UTILITIES ─── */
.flex{display:flex}.gap4{gap:4px}.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.gap24{gap:24px}
.col{flex-direction:column}.wrap{flex-wrap:wrap}.ac{align-items:center}.jb{justify-content:space-between}.jc{justify-content:center}.je{justify-content:flex-end}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:768px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.w100{width:100%}.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.mb4{margin-bottom:4px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.p8{padding:8px}.p12{padding:12px}.p16{padding:16px}.p24{padding:24px}
.bold{font-weight:700}.semi{font-weight:600}.small{font-size:12px}.xs{font-size:11px}
.text-accent{color:var(--accent3)}.text-gold{color:var(--gold)}.text-green{color:var(--green)}.text-red{color:var(--red)}.text-blue{color:var(--blue2)}.text-teal{color:var(--teal)}.text-orange{color:var(--orange)}.text2{color:var(--text2)}.text3{color:var(--text3)}
.hidden{display:none!important}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pointer{cursor:pointer}
/* ─── CARD ─── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:20px}
.card-sm{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
/* ─── BADGE ─── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:0.03em}
.badge-green{background:rgba(16,185,129,0.15);color:var(--green2)}
.badge-red{background:rgba(239,68,68,0.15);color:var(--red2)}
.badge-gold{background:rgba(245,158,11,0.15);color:var(--gold2)}
.badge-blue{background:rgba(59,130,246,0.15);color:var(--blue2)}
.badge-purple{background:rgba(124,58,237,0.15);color:var(--accent3)}
.badge-orange{background:rgba(249,115,22,0.15);color:var(--orange2)}
.badge-teal{background:rgba(20,184,166,0.15);color:var(--teal2)}
.badge-grey{background:rgba(100,116,139,0.15);color:var(--text3)}
/* ─── BUTTONS ─── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:var(--radius);font-size:13px;font-weight:600;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border2)}.btn-secondary:hover{border-color:var(--accent);color:var(--accent3)}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{background:var(--green2);transform:translateY(-1px)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:var(--red2)}
.btn-gold{background:var(--gold);color:#000}.btn-gold:hover{background:var(--gold2)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
.btn-icon{width:34px;height:34px;padding:0;border-radius:8px}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none!important}
/* ─── TABS ─── */
.tabs{display:flex;gap:2px;background:var(--bg4);padding:4px;border-radius:var(--radius);margin-bottom:20px;flex-wrap:wrap}
.tab{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.tab.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(124,58,237,0.4)}
.tab:not(.active):hover{background:var(--card2);color:var(--text)}
/* ─── TABLE ─── */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th{background:var(--bg4);color:var(--text2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border)}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.02)}
/* ─── MODAL ─── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius2);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow2)}
.modal-lg{max-width:820px}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid var(--border)}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.close-btn{background:var(--card2);border:1px solid var(--border2);color:var(--text2);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}.close-btn:hover{color:var(--red)}
/* ─── FORM ROW ─── */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.form-group{margin-bottom:16px}
.form-group:last-child{margin-bottom:0}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
/* ─── TOAST ─── */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;min-width:260px;max-width:380px;animation:slideIn .3s ease;box-shadow:var(--shadow)}
.toast-success{background:#064e3b;border:1px solid var(--green);color:var(--green2)}
.toast-error{background:#450a0a;border:1px solid var(--red);color:var(--red2)}
.toast-info{background:#1e1b4b;border:1px solid var(--accent);color:var(--accent3)}
.toast-warn{background:#451a03;border:1px solid var(--orange);color:var(--orange2)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
/* ─── STAT CARD ─── */
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:20px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.stat-card.purple::before{background:linear-gradient(90deg,var(--accent),var(--accent3))}
.stat-card.green::before{background:linear-gradient(90deg,var(--green),var(--green2))}
.stat-card.gold::before{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.stat-card.blue::before{background:linear-gradient(90deg,var(--blue),var(--blue2))}
.stat-card.teal::before{background:linear-gradient(90deg,var(--teal),var(--teal2))}
.stat-card.orange::before{background:linear-gradient(90deg,var(--orange),var(--orange2))}
.stat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--text3);margin-bottom:8px}
.stat-value{font-size:28px;font-weight:800;line-height:1;margin-bottom:4px}
.stat-sub{font-size:12px;color:var(--text2)}
.stat-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:40px;opacity:0.15}
/* ─── SIDEBAR ─── */
#sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--border);z-index:100;display:flex;flex-direction:column;transition:transform .3s}
.sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.logo-mark{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--accent3),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:10px;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 8px}
.nav-section{margin-bottom:8px}
.nav-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;padding:8px 12px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:500;transition:all .15s;margin-bottom:1px}
.nav-item:hover{background:var(--card2);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff;font-weight:600}
.nav-item .icon{font-size:16px;width:20px;text-align:center}
.nav-item .badge-nav{margin-left:auto;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700}
.sidebar-user{padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--gold));display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}
.user-name{font-size:13px;font-weight:600}
.user-role{font-size:11px;color:var(--text3)}
/* ─── MAIN CONTENT ─── */
#main{margin-left:var(--sidebar);min-height:100vh;background:var(--bg)}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-title{font-size:16px;font-weight:700}
.topbar-sub{font-size:12px;color:var(--text2)}
.topbar-right{display:flex;align-items:center;gap:8px}
.page-content{padding:24px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
/* ─── LOGIN ─── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 20% 20%,rgba(124,58,237,0.15) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(245,158,11,0.08) 0%,transparent 60%),var(--bg);padding:20px}
.login-box{background:var(--bg2);border:1px solid var(--border2);border-radius:24px;padding:40px;width:100%;max-width:440px;box-shadow:var(--shadow2)}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo .brand{font-size:32px;font-weight:800;background:linear-gradient(135deg,var(--accent3),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-logo .tagline{font-size:12px;color:var(--text3);margin-top:4px;letter-spacing:0.1em;text-transform:uppercase}
.login-logo .version{font-size:11px;color:var(--text3);margin-top:2px}
.login-title{font-size:20px;font-weight:700;margin-bottom:24px;text-align:center}
.login-form .form-group{margin-bottom:18px}
.login-btn{width:100%;padding:13px;font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:var(--radius);border:none;cursor:pointer;transition:all .2s;margin-top:8px}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,0.4)}
.login-footer{text-align:center;margin-top:24px;font-size:12px;color:var(--text3)}
.login-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text3);font-size:12px}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.login-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg4);padding:4px;border-radius:10px;margin-bottom:24px}
.login-tab{padding:9px;text-align:center;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:all .15s}
.login-tab.active{background:var(--accent);color:#fff}
.staff-quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.quick-btn{padding:10px 8px;border-radius:8px;text-align:center;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);transition:all .15s;font-size:12px;font-weight:600;color:var(--text2)}
.quick-btn:hover{border-color:var(--accent);color:var(--accent3)}
/* ─── KPI STRIP ─── */
.kpi-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
/* ─── POS ─── */
.pos-layout{display:grid;grid-template-columns:1fr 360px;gap:20px;height:calc(100vh - 140px)}
@media(max-width:900px){.pos-layout{grid-template-columns:1fr;height:auto}}
.pos-left{overflow-y:auto}
.pos-right{overflow-y:auto}
.service-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.service-card{background:var(--card2);border:2px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .15s;text-align:center;position:relative}
.service-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.service-card.selected{border-color:var(--accent);background:rgba(124,58,237,0.1)}
.service-card .s-icon{font-size:28px;margin-bottom:8px}
.service-card .s-name{font-size:12px;font-weight:700;margin-bottom:4px}
.service-card .s-price{font-size:15px;font-weight:800;color:var(--gold)}
.service-card .s-dur{font-size:11px;color:var(--text3)}
.order-summary{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius2);padding:20px;height:fit-content;position:sticky;top:80px}
.order-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.chair-select{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.chair-btn{padding:10px;background:var(--bg3);border:2px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;transition:all .15s;font-size:12px;font-weight:600}
.chair-btn:hover{border-color:var(--accent)}
.chair-btn.active{border-color:var(--green);background:rgba(16,185,129,0.1);color:var(--green)}
.chair-btn.occupied{border-color:var(--red);background:rgba(239,68,68,0.1);color:var(--red);cursor:not-allowed}
.payment-method-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.pay-btn{padding:10px 6px;background:var(--bg3);border:2px solid var(--border);border-radius:8px;text-align:center;cursor:pointer;transition:all .15s;font-size:11px;font-weight:600;color:var(--text2)}
.pay-btn:hover{border-color:var(--accent);color:var(--accent3)}
.pay-btn.selected{border-color:var(--accent);background:rgba(124,58,237,0.15);color:var(--accent3)}
.total-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.total-row.grand{font-size:16px;font-weight:800;padding:10px 0;border-top:2px solid var(--border2);margin-top:8px}
/* ─── TOKEN ─── */
.token-card{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:var(--radius2);padding:20px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
.token-card::after{content:'āMA';position:absolute;right:-10px;bottom:-10px;font-size:60px;font-weight:900;opacity:0.1}
.token-code{font-size:20px;font-weight:800;letter-spacing:0.1em;font-family:monospace;margin:8px 0}
.token-details{font-size:12px;opacity:0.85;line-height:1.8}
/* ─── LOCATION CARD ─── */
.location-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius2);padding:16px;cursor:pointer;transition:all .15s}
.location-card:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(124,58,237,0.15)}
.location-code{font-size:10px;font-weight:800;letter-spacing:0.1em;color:var(--text3);text-transform:uppercase;margin-bottom:4px}
.location-name{font-size:14px;font-weight:700;margin-bottom:4px}
.location-meta{font-size:11px;color:var(--text2);display:flex;gap:8px;flex-wrap:wrap}
/* ─── QUEUE ─── */
.queue-item{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.queue-timer{font-size:20px;font-weight:800;font-family:monospace;color:var(--gold)}
/* ─── HEALTH INDICATOR ─── */
.health-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.health-green{background:var(--green);box-shadow:0 0 6px var(--green)}
.health-red{background:var(--red);box-shadow:0 0 6px var(--red)}
.health-gold{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.health-grey{background:var(--text3)}
/* ─── PROGRESS BAR ─── */
.progress-bar{background:var(--bg4);border-radius:4px;height:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .4s}
.pf-green{background:linear-gradient(90deg,var(--green),var(--green2))}
.pf-gold{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.pf-red{background:linear-gradient(90deg,var(--red),var(--red2))}
.pf-purple{background:linear-gradient(90deg,var(--accent),var(--accent3))}
/* ─── TOGGLE ─── */
.toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--border2);border-radius:11px;transition:.3s;cursor:pointer}
.toggle-slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle input:checked+.toggle-slider{background:var(--accent)}
.toggle input:checked+.toggle-slider::before{transform:translateX(18px)}
/* ─── ACCORDION ─── */
.accord{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.accord-header{padding:12px 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:var(--card);font-weight:600}
.accord-header:hover{background:var(--card2)}
.accord-body{padding:16px;border-top:1px solid var(--border);background:var(--bg2)}
/* ─── SEARCH ─── */
.search-wrap{position:relative}
.search-wrap input{padding-left:36px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px}
/* ─── ALERT ─── */
.alert{padding:12px 16px;border-radius:var(--radius);font-size:13px;margin-bottom:12px;display:flex;align-items:flex-start;gap:10px}
.alert-info{background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.3);color:var(--blue2)}
.alert-warn{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);color:var(--gold2)}
.alert-error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--red2)}
.alert-success{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.3);color:var(--green2)}
/* ─── CRM STAGES ─── */
.crm-stage{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}
.stage-new{background:rgba(99,102,241,0.2);color:#818cf8}
.stage-active{background:rgba(16,185,129,0.2);color:var(--green2)}
.stage-closed{background:rgba(100,116,139,0.2);color:var(--text3)}
.stage-hot{background:rgba(239,68,68,0.2);color:var(--red2)}
/* ─── EMPTY STATE ─── */
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state .es-icon{font-size:48px;margin-bottom:16px;opacity:0.5}
.empty-state p{font-size:14px;margin-bottom:16px}
/* ─── LOYALTY ─── */
.points-display{background:linear-gradient(135deg,var(--gold),var(--orange));border-radius:var(--radius2);padding:20px;color:#000;text-align:center}
.points-big{font-size:40px;font-weight:900;line-height:1}
.points-label{font-size:12px;font-weight:700;opacity:0.8;margin-top:4px}
/* ─── REPORT ─── */
.report-section{margin-bottom:24px}
.report-section h3{font-size:14px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.report-section h3::after{content:'';flex:1;height:1px;background:var(--border)}
.report-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.report-cell{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px}
.report-cell-label{font-size:11px;color:var(--text3);margin-bottom:4px}
.report-cell-value{font-size:16px;font-weight:800}
/* ─── COMMISSION ─── */
.commission-tier{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
/* ─── MOBILE RESPONSIVE ─── */
@media(max-width:768px){
  :root{--sidebar:0px}
  #sidebar{transform:translateX(-100%);width:260px}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0}
  .topbar{padding:0 16px}
  .page-content{padding:16px}
  .pos-layout{grid-template-columns:1fr}
  .kpi-strip{grid-template-columns:1fr 1fr}
}
#menu-toggle{display:none;background:var(--card2);border:1px solid var(--border2);color:var(--text);width:36px;height:36px;border-radius:8px;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
@media(max-width:768px){#menu-toggle{display:flex}}
.overlay-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99}
.overlay-bg.show{display:block}
/* ─── ANIMATIONS ─── */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .25s ease}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.pulse{animation:pulse 2s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
/* ─── PRINT ─── */
@media print{#sidebar,#login-screen,.no-print{display:none!important}#main{margin-left:0}}
</style>

const fmt = {
  currency(n){return '₹'+Number(n||0).toLocaleString('en-IN')},
  num(n){return Number(n||0).toLocaleString('en-IN')},
  pct(n,d){return d?((n/d)*100).toFixed(1)+'%':'—'},
  date(d){return d?new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—'},
  time(d){return d?new Date(d).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'—'},
  datetime(d){return d?fmt.date(d)+' '+fmt.time(d):'—'},
  duration(min){return min>=60?Math.floor(min/60)+'h '+(min%60?min%60+'m':''):min+'min'},
  ago(d){const diff=Date.now()-new Date(d);const m=Math.floor(diff/60000);if(m<1)return 'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';},
  truncate(s,n=30){return s&&s.length>n?s.slice(0,n)+'…':s||''}
};
function toast(msg,type='info',dur=3000){
  const t=document.createElement('div');
  const icons={success:'✅',error:'❌',info:'ℹ️',warn:'⚠️'};
  t.className=`toast toast-${type}`;
  t.innerHTML=`<span>${icons[type]||'ℹ️'}</span><span>${msg}</span>`;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(()=>t.remove(),dur);
}

function compressImage(file,cb){
  const reader=new FileReader();
  reader.onload=e=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const MAX=800,scale=Math.min(1,MAX/img.width);canvas.width=img.width*scale;canvas.height=img.height*scale;canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);cb(canvas.toDataURL('image/jpeg',0.82));};img.src=e.target.result;};reader.readAsDataURL(file);
}
async function activateESP32(location,channel,durationSec,token){
  const esp=location.esp32;
  if(!esp?.ip)return{success:false,reason:'ESP32 not configured'};
  try{const res=await fetch(`http://${esp.ip}:${esp.port||80}/activate`,{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':esp.apiKey||''},body:JSON.stringify({channel,duration:durationSec,token}),signal:AbortSignal.timeout(5000)});return await res.json();}
  catch(e){return{success:false,reason:'ESP32 unreachable'}}
}
async function deactivateESP32(location,channel){
  const esp=location.esp32;if(!esp?.ip)return{success:false};
  try{const res=await fetch(`http://${esp.ip}:${esp.port||80}/deactivate`,{method:'POST',headers:{'Content-Type':'application/json','X-API-Key':esp.apiKey||''},body:JSON.stringify({channel}),signal:AbortSignal.timeout(5000)});return await res.json();}
  catch(e){return{success:false}}
}

}
function startApp(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  const user=STATE.user;
  const initials=user.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  document.getElementById('user-avatar').textContent=initials;
  document.getElementById('user-display-name').textContent=user.name;
  document.getElementById('user-display-role').textContent=ROLES[user.role]?.label||user.role;
  const loc=STATE.locationCode?getLocation(STATE.locationCode):null;
  document.getElementById('sidebar-location-label').textContent=loc?loc.name:'All Locations';
  buildSidebar();navigate('dashboard');startClock();checkPendingApprovals();
}
function buildSidebar(){
  const nav=document.getElementById('sidebar-nav');nav.innerHTML='';
  let currentSection='';let openSection=false;
  NAV_ITEMS.forEach(item=>{
    if(!hasRole(item.minRole))return;
    if(item.section!==currentSection){
      if(openSection)nav.innerHTML+='</div>';
      currentSection=item.section;openSection=true;
      nav.innerHTML+=`<div class="nav-section"><div class="nav-label">${currentSection}</div>`;
    }
    const badge=item.id==='users'&&STATE.pendingApprovals>0?`<span class="badge-nav">${STATE.pendingApprovals}</span>`:'';
    nav.innerHTML+=`<div class="nav-item${STATE.page===item.id?' active':''}" onclick="navigate('${item.id}')" id="nav-${item.id}">
      <span class="icon">${item.icon}</span>${item.label}${badge}</div>`;
  });
  if(openSection)nav.innerHTML+='</div>';
}
function navigate(page){
  STATE.page=page;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const navEl=document.getElementById(`nav-${page}`);if(navEl)navEl.classList.add('active');
  const item=NAV_ITEMS.find(n=>n.id===page);
  document.getElementById('topbar-title').textContent=item?.label||page;
  const loc=STATE.locationCode?getLocation(STATE.locationCode):null;
  document.getElementById('topbar-sub').textContent=loc?loc.station:'Network — All Locations';

function startClock(){

// ─── DASHBOARD ────────────────────────────────────────────────────
function setDashRange(preset){
  const now=new Date();
  const tod=v=>v.toISOString().slice(0,10);
  if(preset==='today'){STATE.dashFrom=tod(now);STATE.dashTo=tod(now);}
  else if(preset==='yesterday'){const y=new Date(now);y.setDate(y.getDate()-1);STATE.dashFrom=tod(y);STATE.dashTo=tod(y);}
  else if(preset==='week'){const w=new Date(now);w.setDate(w.getDate()-6);STATE.dashFrom=tod(w);STATE.dashTo=tod(now);}
  else if(preset==='month'){STATE.dashFrom=tod(now).slice(0,7)+'-01';STATE.dashTo=tod(now);}
  else if(preset==='clear'){STATE.dashFrom=null;STATE.dashTo=null;}
  navigate('dashboard');
}
function applyDashCustomRange(){
  STATE.dashFrom=document.getElementById('dash-from')?.value||null;
  STATE.dashTo=document.getElementById('dash-to')?.value||null;
  navigate('dashboard');
}
function renderDashboard(){
  const locs=getLocations();
  const transactions=DB.get('transactions')||[];
  const today=new Date().toDateString();
  const filterLoc=t=>!STATE.locationCode||t.locationCode===STATE.locationCode;
  // Date range filtering
  const fromDate=STATE.dashFrom?new Date(STATE.dashFrom):null;
  const toDate=STATE.dashTo?new Date(STATE.dashTo+' 23:59:59'):null;
  const inRange=t=>{
    const d=new Date(t.ts);
    if(fromDate&&d<fromDate)return false;
    if(toDate&&d>toDate)return false;
    return true;
  };
  const rangeLabel=STATE.dashFrom?(STATE.dashFrom===STATE.dashTo?STATE.dashFrom:`${STATE.dashFrom} → ${STATE.dashTo}`):'All time';
  const rangeFiltered=transactions.filter(t=>filterLoc(t)&&inRange(t));
  // If no range, fall back to today for KPIs
  const todayTxn=transactions.filter(t=>new Date(t.ts).toDateString()===today&&filterLoc(t));
  const displayTxn=STATE.dashFrom?rangeFiltered:todayTxn;
  const todayFiltered=displayTxn;
  const todayRev=todayFiltered.reduce((s,t)=>s+(t.amount||0),0);
  const todaySessions=todayFiltered.filter(t=>t.type==='session').length;
  const todayUPI=todayFiltered.filter(t=>t.paymentMode==='upi').reduce((s,t)=>s+(t.amount||0),0);
  const todayCash=todayFiltered.filter(t=>t.paymentMode==='cash').reduce((s,t)=>s+(t.amount||0),0);
  const activeSessions=Object.keys(STATE.activeTimers).length;
  const activeLocs=locs.filter(l=>l.active&&!l.isVendor).length;
  const totalChairs=locs.reduce((s,l)=>s+(l.chairs||0),0);
  const recentTxn=(STATE.dashFrom?rangeFiltered:transactions.filter(filterLoc)).slice(-10).reverse();
  // Chart: last 7 days or range days
  const chartDays=STATE.dashFrom&&STATE.dashFrom!==STATE.dashTo?
    (()=>{const days=[];const d=new Date(STATE.dashFrom);const end=new Date(STATE.dashTo||today);while(d<=end){days.push(new Date(d));d.setDate(d.getDate()+1);}return days.slice(-14);})()):
    Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-i);return d;}).reverse();
  const weekRev=chartDays.map(d=>{
    const ds=d.toDateString();
    const rev=transactions.filter(t=>filterLoc(t)&&new Date(t.ts).toDateString()===ds).reduce((s,t)=>s+(t.amount||0),0);
    return {day:d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric'}),rev};
  });
  const maxRev=Math.max(...weekRev.map(w=>w.rev),1);
  const pendingStaff=(DB.get('pending-staff')||[]).filter(r=>r.status==='pending');
  return `
  ${pendingStaff.length>0?`<div class="alert alert-warn mb16">⚠️ <strong>${pendingStaff.length} pending staff registration${pendingStaff.length>1?'s':''}</strong> awaiting approval. <a onclick="navigate('users')" style="cursor:pointer;text-decoration:underline">Review now →</a></div>`:''}

  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px;background:var(--card);padding:12px;border-radius:var(--radius);border:1px solid var(--border)">
    <span style="font-size:12px;color:var(--text2);font-weight:600">📅 Date Range:</span>
    <button class="btn btn-sm ${!STATE.dashFrom?'btn-primary':'btn-secondary'}" onclick="setDashRange('today')">Today</button>
    <button class="btn btn-sm btn-secondary" onclick="setDashRange('yesterday')">Yesterday</button>
    <button class="btn btn-sm btn-secondary" onclick="setDashRange('week')">Last 7 Days</button>
    <button class="btn btn-sm btn-secondary" onclick="setDashRange('month')">This Month</button>
    ${STATE.dashFrom?`<button class="btn btn-sm btn-danger" onclick="setDashRange('clear')">✕ Clear</button>`:''}
    <div style="display:flex;align-items:center;gap:6px;margin-left:auto">
      <input type="date" id="dash-from" value="${STATE.dashFrom||''}" style="padding:4px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px">
      <span style="color:var(--text3)">→</span>
      <input type="date" id="dash-to" value="${STATE.dashTo||''}" style="padding:4px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px">
      <button class="btn btn-primary btn-sm" onclick="applyDashCustomRange()">Apply</button>
    </div>
    ${STATE.dashFrom?`<div style="width:100%;font-size:11px;color:var(--accent2);margin-top:4px">Showing: <strong>${rangeLabel}</strong> · ${displayTxn.length} transactions · ₹${fmt.num(todayRev)} revenue</div>`:''}
  </div>

  <div class="kpi-strip">
    <div class="stat-card purple">
      <div class="stat-label">${STATE.dashFrom?'Period Revenue':'Today\'s Revenue'}</div>
      <div class="stat-value text-accent">${fmt.currency(todayRev)}</div>
      <div class="stat-sub">UPI: ${fmt.currency(todayUPI)} · Cash: ${fmt.currency(todayCash)}</div>
      <div class="stat-icon">💰</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">${STATE.dashFrom?'Sessions in Period':'Sessions Today'}</div>
      <div class="stat-value text-green">${todaySessions}</div>
      <div class="stat-sub">${activeSessions} active right now</div>
      <div class="stat-icon">💺</div>
    </div>
    <div class="stat-card gold">
      <div class="stat-label">Active Locations</div>
      <div class="stat-value text-gold">${activeLocs}</div>
      <div class="stat-sub">${totalChairs} chairs · ${locs.filter(l=>l.isVendor).length} vendors</div>
      <div class="stat-icon">📍</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-label">Avg Ticket</div>
      <div class="stat-value text-blue">${todaySessions?fmt.currency(Math.round(todayRev/todaySessions)):'₹—'}</div>
      <div class="stat-sub">Total: ${fmt.num(transactions.filter(filterLoc).length)} all-time</div>
      <div class="stat-icon">📊</div>
    </div>
  </div>
  <div class="grid2">
    <div class="card">
      <div class="card-header"><h3>📈 7-Day Revenue</h3></div>
      <div style="display:flex;align-items:flex-end;gap:6px;height:100px;padding:8px 0">
        ${weekRev.map(w=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
          <div style="flex:1;width:100%;background:var(--bg4);border-radius:4px 4px 0 0;display:flex;align-items:flex-end;overflow:hidden">
            <div style="width:100%;height:${Math.round((w.rev/maxRev)*100)}%;background:linear-gradient(180deg,var(--accent),var(--accent2));min-height:2px"></div>
          </div>
          <div style="font-size:10px;color:var(--text3)">${w.day}</div>
          <div style="font-size:10px;color:var(--text2);font-weight:700">${w.rev?'₹'+Math.round(w.rev/1000)+'k':'-'}</div>
        </div>`).join('')}
      </div>
    </div>
    <div class="card">
      <div class="card-header"><h3>🏢 Network Status</h3><button class="btn btn-secondary btn-sm" onclick="navigate('locations')">All Locations</button></div>
      <div style="max-height:200px;overflow-y:auto">
        ${getLocations().filter(l=>l.active).slice(0,8).map(l=>`
        <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)">
          <div>
            <div style="font-size:12px;font-weight:600">${l.name}</div>
            <div style="font-size:11px;color:var(--text3)">${l.zone} · ${l.chairs} chairs</div>
          </div>
          <div class="flex gap8 ac">
            ${l.isVendor?'<span class="badge badge-orange">Vendor</span>':'<span class="badge badge-green">Active</span>'}
            ${l.meterBalance<500&&l.meterBalance>0?'<span class="badge badge-red">Low Meter</span>':''}
          </div>
        </div>`).join('')}
        ${getLocations().filter(l=>l.active).length>8?`<div style="text-align:center;padding:8px;font-size:12px;color:var(--text3)">+${getLocations().filter(l=>l.active).length-8} more</div>`:''}
      </div>
    </div>
  </div>
  <div class="card mt16">
    <div class="card-header">
      <h3>🕐 Recent Transactions</h3>
      <button class="btn btn-secondary btn-sm" onclick="navigate('data-history')">Full History</button>
    </div>
    ${recentTxn.length?`
    <div class="table-wrap">
      <table>
        <thead><tr><th>Time</th><th>Location</th><th>Service</th><th>Amount</th><th>Mode</th><th>Token</th></tr></thead>
        <tbody>
          ${recentTxn.map(t=>`<tr>
            <td>${fmt.time(t.ts)}</td>
            <td>${getLocation(t.locationCode)?.name||t.locationCode}</td>
            <td>${t.serviceName||'—'}</td>
            <td class="text-green bold">${fmt.currency(t.amount)}</td>
            <td><span class="badge ${t.paymentMode==='upi'?'badge-blue':t.paymentMode==='cash'?'badge-gold':'badge-purple'}">${(t.paymentMode||'—').toUpperCase()}</span></td>
            <td><code style="font-size:11px;color:var(--text3)">${fmt.truncate(t.token||'—',16)}</code></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`:`<div class="empty-state"><div class="es-icon">📊</div><p>No transactions today. Start your first POS session!</p></div>`}
  </div>`;
}

function filterServices(category,el){

  if(el)el.classList.add('active');
  const services=getServices().filter(s=>s.active);
  const filtered=category==='custom'?[]:services.filter(s=>s.category===category);
  const grid=document.getElementById('service-grid');
  if(!grid)return;
  if(category==='custom'){
    grid.innerHTML=`<div style="grid-column:1/-1">
      <p class="text2 small mb8">Add a custom amount service:</p>
      <div class="form-row">
        <div class="form-group">
          <label>Service Name</label>
          <input type="text" id="custom-svc-name" placeholder="Custom Service">
        </div>
        <div class="form-group">
          <label>Amount (₹)</label>
          <input type="number" id="custom-svc-price" placeholder="0">
        </div>
      </div>
      <button class="btn btn-primary" onclick="addCustomService()">Add to Order</button>
    </div>`;
    return;
  }
  grid.innerHTML=filtered.map(s=>`
  <div class="service-card" onclick="selectService('${s.id}')" id="svc-${s.id}">
    <div class="s-icon">${s.icon}</div>

  </div>`).join('');
}
function addCustomService(){
  const name=document.getElementById('custom-svc-name')?.value||'Custom';
  const price=parseInt(document.getElementById('custom-svc-price')?.value)||0;
  if(!price){toast('Enter a valid amount','error');return}
  STATE.posOrder.push({id:'custom_'+uid(),name,duration:0,price,category:'custom',icon:'🔧'});
  updateOrderSummary();
}
function selectService(id){
  const svc=getServices().find(s=>s.id===id);
  if(!svc)return;
  const existing=STATE.posOrder.find(o=>o.id===id);
  if(existing){STATE.posOrder=STATE.posOrder.filter(o=>o.id!==id);toast('Removed from order','info');}
  else{STATE.posOrder.push({...svc});toast('Added: '+svc.name,'success');}
  updateOrderSummary();
}
function updateOrderSummary(){
  const items=document.getElementById('order-items');
  const totals=document.getElementById('pos-totals');
  if(!items)return;
  if(STATE.posOrder.length===0){
    items.innerHTML='<div class="empty-state" style="padding:30px 0"><div style="font-size:32px">💆</div><p style="font-size:12px">Select a service to begin</p></div>';
    if(totals)totals.classList.add('hidden');return;
  }
  if(totals)totals.classList.remove('hidden');
  const subtotal=STATE.posOrder.reduce((s,o)=>s+(o.price||0),0);
  items.innerHTML=STATE.posOrder.map(o=>`
  <div class="order-item">
    <div><div style="font-size:13px;font-weight:600">${o.icon} ${o.name}</div><div style="font-size:11px;color:var(--text3)">${o.duration?fmt.duration(o.duration):'Pass'}</div></div>
    <div class="flex ac gap8">
      <span class="text-gold bold">${fmt.currency(o.price)}</span>
      <button class="btn btn-danger btn-xs" onclick="STATE.posOrder=STATE.posOrder.filter(x=>x.id!=='${o.id}');updateOrderSummary()">✕</button>
    </div>
  </div>`).join('');
  document.getElementById('pos-subtotal').textContent=fmt.currency(subtotal);
  document.getElementById('pos-total').textContent=fmt.currency(subtotal);
}

async function completeSale(){
  if(!STATE.posOrder.length){toast('Add at least one service','error');return}
  if(!STATE.posPayment){toast('Select payment method','error');return}
  const loc=STATE.locationCode?getLocation(STATE.locationCode):getLocations()[0];
  if(!loc){toast('No location selected','error');return}
  const phone=document.getElementById('pos-phone')?.value||'';
  const customerName=document.getElementById('pos-customer-name')?.value||'Walk-in';
  const remarks=document.getElementById('pos-remarks')?.value||'';
  const subtotal=STATE.posOrder.reduce((s,o)=>s+(o.price||0),0);
  const firstSvc=STATE.posOrder[0];
  const eqCode=loc.equipment?.[0]||'1A';
  const token=generateToken(loc.code,eqCode);
  
  const txn={
    id:uid(),token,ts:new Date().toISOString(),
    locationCode:loc.code,locationName:loc.name,
    services:STATE.posOrder.map(o=>o.id),
    serviceName:STATE.posOrder.map(o=>o.name).join(' + '),
    amount:subtotal,paymentMode:STATE.posPayment,
    customerPhone:phone,customerName,remarks,
    staffId:STATE.user.id,staffName:STATE.user.name,
    duration:firstSvc.duration||0,type:'session'
  };
  DB.push('transactions',txn);
  // Loyalty points
  if(phone){
    const cfg=getConfig();
    const pts=Math.floor(subtotal/100*cfg.loyaltyRate);
    const loyalty=DB.get('loyalty_'+phone)||{phone,name:customerName,points:0,history:[]};
    loyalty.points+=pts;
    loyalty.history.push({ts:txn.ts,pts,reason:'Purchase',txnId:txn.id});
    DB.set('loyalty_'+phone,loyalty);
  }
  // ESP32
  let espResult={success:false,reason:'Not triggered'};
  if(firstSvc.duration>0&&loc.esp32?.ip){
    const channel=parseInt(Object.keys(loc.esp32.channels)[0])||1;
    espResult=await activateESP32(loc,channel,firstSvc.duration*60,token);
    if(espResult.success){
      STATE.activeTimers[loc.code+'_'+eqCode]={start:Date.now(),duration:firstSvc.duration*60*1000,token,channel};
      toast(`ESP32: Chair activated for ${fmt.duration(firstSvc.duration)}`,'success');
    } else {
      toast(`ESP32: ${espResult.reason} — Token issued but chair not auto-started`,'warn',5000);
    }
  }
  // Show receipt
  showReceipt(txn,espResult);
  STATE.posOrder=[];STATE.posPayment=null;
  updateOrderSummary();
  document.querySelectorAll('.pay-btn').forEach(b=>b.classList.remove('selected'));
}

    <div class="modal-header"><h3>✅ Sale Complete!</h3><button class="close-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="token-card">
        <div style="font-size:12px;opacity:0.8;font-weight:700;letter-spacing:0.1em">SESSION TOKEN</div>
        <div class="token-code">${txn.token}</div>
        <div class="token-details">

function renderQueue(){
  return `
  <div class="page-header">
    <h1>⏱️ Session Queue</h1>
    <button class="btn btn-primary" onclick="refreshQueue()">🔄 Refresh</button>
  </div>
  <div id="queue-container">
    <div class="empty-state"><div class="es-icon">⏱️</div><p>No active sessions right now</p></div>
  </div>`;
}
function initQueue(){
  renderQueueItems();
  setInterval(renderQueueItems,5000);
}
function renderQueueItems(){
  const el=document.getElementById('queue-container');
  if(!el)return;
  const now=Date.now();
  const timers=Object.entries(STATE.activeTimers).filter(([k])=>!STATE.locationCode||k.startsWith(STATE.locationCode));
  if(!timers.length){el.innerHTML='<div class="empty-state"><div class="es-icon">⏱️</div><p>No active sessions right now</p></div>';return;}
  el.innerHTML=timers.map(([key,t])=>{
    const elapsed=now-t.start;
    const remaining=Math.max(0,t.duration-elapsed);
    const mins=Math.floor(remaining/60000);
    const secs=Math.floor((remaining%60000)/1000);
    const pct=Math.round((elapsed/t.duration)*100);
    const [locCode,eq]=key.split('_');
    const loc=getLocation(locCode);
    return `<div class="queue-item">
      <div>
        <div class="bold">${loc?.name||locCode} — ${eq}</div>
        <div class="small text2">${t.token}</div>
        <div class="progress-bar mt8" style="width:200px"><div class="progress-fill pf-purple" style="width:${pct}%"></div></div>
      </div>
      <div class="flex col ac">
        <div class="queue-timer">${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}</div>
        <div class="small text3">${pct}% done</div>
        <button class="btn btn-danger btn-xs mt4" onclick="endSession('${key}')">End Early</button>
      </div>
    </div>`;
  }).join('');
}
function refreshQueue(){renderQueueItems();toast('Queue refreshed','info')}
function endSession(key){
  delete STATE.activeTimers[key];
  renderQueueItems();
  toast('Session ended','success');
}

function renderTxnTable(txns){
  if(!txns.length)return '<div class="empty-state"><div class="es-icon">💳</div><p>No transactions found</p></div>';
  return `<table><thead><tr><th>Date/Time</th><th>Location</th><th>Service</th><th>Customer</th><th>Amount</th><th>Mode</th><th>Token</th><th>Staff</th></tr></thead>
  <tbody>${txns.map(t=>`<tr>
    <td style="white-space:nowrap">${fmt.datetime(t.ts)}</td>
    <td>${getLocation(t.locationCode)?.name||t.locationCode}</td>
    <td>${fmt.truncate(t.serviceName||'—',24)}</td>
    <td>${t.customerPhone?t.customerPhone:'Walk-in'}</td>
    <td class="text-green bold">${fmt.currency(t.amount)}</td>
    <td><span class="badge ${t.paymentMode==='upi'?'badge-blue':t.paymentMode==='cash'?'badge-gold':'badge-purple'}">${(t.paymentMode||'—').toUpperCase()}</span></td>
    <td style="font-family:monospace;font-size:11px;color:var(--text3)">${fmt.truncate(t.token||'—',14)}</td>
    <td>${fmt.truncate(t.staffName||'—',16)}</td>
  </tr>`).join('')}</tbody></table>`;
}
function filterTxns(q){
  const mode=document.getElementById('txn-mode-filter')?.value||'';
  const txns=(DB.get('transactions')||[]).filter(t=>{
    const locMatch=!STATE.locationCode||t.locationCode===STATE.locationCode;
    const modeMatch=!mode||t.paymentMode===mode;
    const qMatch=!q||JSON.stringify(t).toLowerCase().includes(q.toLowerCase());
    return locMatch&&modeMatch&&qMatch;
  }).slice().reverse().slice(0,100);
  const wrap=document.getElementById('txn-table-wrap');
  if(wrap)wrap.innerHTML=renderTxnTable(txns);
}
function renderPhonePeTable(data){
  if(!data.length)return '';

function importData(e){
  const file=e.target.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      Object.entries(data).forEach(([k,v])=>DB.set(k,v));
      toast('Data imported! Reload to see changes.','success');
    }catch(err){toast('Invalid JSON file','error')}
  };reader.readAsText(file);
}
function importPhonePe(e){
  const file=e.target.files?.[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      if(file.name.endsWith('.json')){
        const data=JSON.parse(ev.target.result);
        const arr=Array.isArray(data)?data:[data];
        DB.set('phonePe-imports',arr);
        toast(`Imported ${arr.length} PhonePe records`,'success');
        showHistoryTab('phonePe',null);
      } else {
        // CSV parse
        const rows=ev.target.result.split('\n').slice(1).filter(r=>r.trim());
        const parsed=rows.map(row=>{const cols=row.split(',');return{date:cols[0],description:cols[1],amount:parseFloat(cols[2])||0,status:cols[3]||'',ts:new Date().toISOString()};});
        DB.set('phonePe-imports',parsed);
        toast(`Imported ${parsed.length} PhonePe records`,'success');
        showHistoryTab('phonePe',null);
      }
    }catch(err){toast('Import failed: '+err.message,'error')}
  };reader.readAsText(file);
}

function saveLocationFromModal(code){
  const locs=getLocations();
  const idx=locs.findIndex(l=>l.code===code);
  if(idx<0)return;
  const l={...locs[idx]};
  // Details
  if(document.getElementById('lf-name'))l.name=document.getElementById('lf-name').value;
  if(document.getElementById('lf-fullName'))l.fullName=document.getElementById('lf-fullName').value;
  if(document.getElementById('lf-station'))l.station=document.getElementById('lf-station').value;
  if(document.getElementById('lf-city'))l.city=document.getElementById('lf-city').value;
  if(document.getElementById('lf-state'))l.state=document.getElementById('lf-state').value;
  if(document.getElementById('lf-zone'))l.zone=document.getElementById('lf-zone').value;
  if(document.getElementById('lf-chairs'))l.chairs=parseInt(document.getElementById('lf-chairs').value)||l.chairs;
  if(document.getElementById('lf-shift'))l.shiftTemplate=document.getElementById('lf-shift').value;
  if(document.getElementById('lf-phonepeId'))l.phonepeStoreId=document.getElementById('lf-phonepeId').value;
  if(document.getElementById('lf-vendorName'))l.vendorName=document.getElementById('lf-vendorName').value;
  if(document.getElementById('lf-active'))l.active=document.getElementById('lf-active').checked;
  if(document.getElementById('lf-isVendor'))l.isVendor=document.getElementById('lf-isVendor').checked;
  // Utilities
  if(document.getElementById('lf-meterBalance'))l.meterBalance=parseFloat(document.getElementById('lf-meterBalance').value)||0;
  if(document.getElementById('lf-meterLastUpdated'))l.meterLastUpdated=document.getElementById('lf-meterLastUpdated').value;
  if(document.getElementById('lf-internetProvider'))l.internetProvider=document.getElementById('lf-internetProvider').value;
  if(document.getElementById('lf-internetBalance'))l.internetBalance=document.getElementById('lf-internetBalance').value;
  if(document.getElementById('lf-internetLastRecharged'))l.internetLastRecharged=document.getElementById('lf-internetLastRecharged').value;
  // Inventory
  if(document.getElementById('lf-inv-chairs'))l.inventory={...l.inventory,
    chairs:parseInt(document.getElementById('lf-inv-chairs')?.value)||0,
    legMassagers:parseInt(document.getElementById('lf-inv-legMassagers')?.value)||0,
    gunStations:parseInt(document.getElementById('lf-inv-gunStations')?.value)||0,
    fans:parseInt(document.getElementById('lf-inv-fans')?.value)||0,
    lights:parseInt(document.getElementById('lf-inv-lights')?.value)||0,
    stationaryKit:document.getElementById('lf-inv-stationaryKit')?.checked||false,
    cleaningKit:document.getElementById('lf-inv-cleaningKit')?.checked||false,
    otherItems:(document.getElementById('lf-inv-other')?.value||'').split(',').map(s=>s.trim()).filter(Boolean)
  };
  // ESP32
  if(document.getElementById('lf-esp-ip'))l.esp32={...l.esp32,
    ip:document.getElementById('lf-esp-ip').value,
    port:parseInt(document.getElementById('lf-esp-port')?.value)||80,
    apiKey:document.getElementById('lf-esp-key')?.value||'',
    channels:{
      1:{equipmentCode:document.getElementById('lf-esp-ch1-eq')?.value||'',label:document.getElementById('lf-esp-ch1-label')?.value||''},
      2:{equipmentCode:document.getElementById('lf-esp-ch2-eq')?.value||'',label:document.getElementById('lf-esp-ch2-label')?.value||''},
      3:{equipmentCode:document.getElementById('lf-esp-ch3-eq')?.value||'',label:document.getElementById('lf-esp-ch3-label')?.value||''},
      4:{equipmentCode:document.getElementById('lf-esp-ch4-eq')?.value||'',label:document.getElementById('lf-esp-ch4-label')?.value||''}
    }
  };
  // Remarks
  if(document.getElementById('lf-remarks'))l.remarks=document.getElementById('lf-remarks').value;
  if(document.getElementById('lf-adminNotes'))l.adminNotes=document.getElementById('lf-adminNotes').value;
  locs[idx]=l;DB.set('locations',locs);closeModal();navigate('locations');toast('Location saved!','success');
}
async function testESP32(code){
  const l=getLocation(code);
  const ip=document.getElementById('lf-esp-ip')?.value||l.esp32?.ip;
  if(!ip){toast('Enter IP address first','error');return}
  toast('Testing ESP32 connection...','info');
  try{
    const res=await fetch(`http://${ip}:${document.getElementById('lf-esp-port')?.value||80}/status`,{signal:AbortSignal.timeout(5000)});
    const data=await res.json();
    toast('ESP32 connected! Status: '+JSON.stringify(data),'success',5000);
  }catch(e){toast('ESP32 unreachable: '+e.message,'error',5000)}
}

function loadESPChannels(){
  const code=document.getElementById('esp-loc-select')?.value;
  if(!code)return;
  const l=getLocation(code);if(!l)return;
  const sel=document.getElementById('esp-channel-select');
  if(!sel)return;
  sel.innerHTML=[1,2,3,4].map(ch=>{
    const chan=l.esp32?.channels?.[ch];
    return `<option value="${ch}">CH${ch}${chan?.label?' — '+chan.label:''}</option>`;
  }).join('');
  document.getElementById('esp-token').value=generateToken(l.code,(l.esp32?.channels?.[1]?.equipmentCode||'1A'));
}
async function manualESP32Activate(){
  const code=document.getElementById('esp-loc-select')?.value;
  if(!code){toast('Select a location','error');return}
  const l=getLocation(code);
  const channel=parseInt(document.getElementById('esp-channel-select')?.value)||1;
  const duration=parseInt(document.getElementById('esp-duration')?.value)||15;
  const token=document.getElementById('esp-token')?.value||generateToken(l.code,'1A');
  const result=await activateESP32(l,channel,duration*60,token);
  const el=document.getElementById('esp-result');
  if(el)el.innerHTML=`<div class="alert ${result.success?'alert-success':'alert-error'}">${result.success?'✅ Channel activated!':'❌ '+result.reason}</div>`;
}
async function manualESP32Deactivate(){
  const code=document.getElementById('esp-loc-select')?.value;
  if(!code){toast('Select a location','error');return}
  const l=getLocation(code);
  const channel=parseInt(document.getElementById('esp-channel-select')?.value)||1;
  const result=await deactivateESP32(l,channel);
  const el=document.getElementById('esp-result');
  if(el)el.innerHTML=`<div class="alert ${result.success?'alert-success':'alert-error'}">${result.success?'✅ Channel deactivated!':'❌ Failed to deactivate'}</div>`;
}
async function testESP32Status(){
  const code=document.getElementById('esp-loc-select')?.value;
  if(!code){toast('Select a location','error');return}
  const l=getLocation(code);
  if(!l.esp32?.ip){toast('No ESP32 configured for this location','error');return}
  try{
    const res=await fetch(`http://${l.esp32.ip}:${l.esp32.port||80}/status`,{signal:AbortSignal.timeout(5000)});
    const data=await res.json();
    const el=document.getElementById('esp-result');
    if(el)el.innerHTML=`<div class="alert alert-success"><pre style="font-size:12px">${JSON.stringify(data,null,2)}</pre></div>`;
  }catch(e){
    const el=document.getElementById('esp-result');
    if(el)el.innerHTML=`<div class="alert alert-error">❌ ESP32 unreachable: ${e.message}</div>`;
  }
}

function bulkSelectAll(checked){
  document.querySelectorAll('.bulk-cb').forEach(cb=>cb.checked=checked);
}
function getSelectedIds(){
  return [...document.querySelectorAll('.bulk-cb:checked')].map(cb=>cb.dataset.id);
}
function applyBulkDiscount(scope){
  const pct=parseFloat(document.getElementById('bulk-discount-pct')?.value);
  if(!pct||pct<=0||pct>=100){toast('Enter a valid discount % (1-99)','error');return;}
  const selectedIds=getSelectedIds();
  let changed=0;
  // Apply to services
  if(scope==='services'||scope==='all'){
    const svcs=getServices();
    svcs.forEach(s=>{
      if(scope==='all'||selectedIds.includes(s.id)){
        s._origPrice=s._origPrice||s.price;
        s.price=Math.round(s._origPrice*(1-pct/100));
        s._discounted=true;s._discPct=pct;changed++;
      }
    });
    DB.set('services',svcs);
  }
  // Apply to passes
  if(scope==='passes'||scope==='all'){
    const passes=DB.get('passes')||[];
    passes.forEach(p=>{
      p._origPrice=p._origPrice||p.price;
      p.price=Math.round(p._origPrice*(1-pct/100));
      p._discounted=true;p._discPct=pct;changed++;
    });
    DB.set('passes',passes);
  }
  const st=document.getElementById('bulk-status');
  if(st){st.textContent=`✓ ${pct}% discount applied to ${changed} items`;st.style.display='block';}
  toast(`${pct}% discount applied to ${changed} items`,'success');
  document.getElementById('services-table-body').innerHTML=renderServicesRows();
}
function bulkToggleActive(active){
  const selectedIds=getSelectedIds();
  if(!selectedIds.length){toast('Select at least one item','error');return;}
  const svcs=getServices();
  let changed=0;
  svcs.forEach(s=>{if(selectedIds.includes(s.id)){s.active=active;changed++;}});
  DB.set('services',svcs);
  toast(`${changed} services ${active?'activated':'deactivated'}`,'success');
  document.getElementById('services-table-body').innerHTML=renderServicesRows();
}
function resetBulkDiscount(){
  // Reset all discounts back to original price
  const svcs=getServices();
  svcs.forEach(s=>{if(s._origPrice){s.price=s._origPrice;delete s._origPrice;delete s._discounted;delete s._discPct;}});
  DB.set('services',svcs);
  const passes=DB.get('passes')||[];
  passes.forEach(p=>{if(p._origPrice){p.price=p._origPrice;delete p._origPrice;delete p._discounted;delete p._discPct;}});
  DB.set('passes',passes);
  toast('All discounts reset to original prices','success');
  showConfigTab('services',null);
}
function toggleService(id,checked){
  const svcs=getServices();const idx=svcs.findIndex(s=>s.id===id);
  if(idx>=0){svcs[idx].active=checked;DB.set('services',svcs);}
}

// ─── INIT ─────────────────────────────────────────────────────────
function init(){
  initDefaultUsers();
  seedExcelData();
  // Populate login location select
  const sel=document.getElementById('login-location');
  if(sel){
    getLocations().forEach(l=>{
      const opt=document.createElement('option');opt.value=l.code;opt.textContent=l.name+(l.city?' — '+l.city:'');sel.appendChild(opt);
    });
  }
  // Quick login buttons
  const qb=document.getElementById('quick-logins');
  if(qb){
    const quickUsers=[{u:'admin',p:'admin123',label:'Admin'},{u:'manager',p:'mgr123',label:'Manager'},{u:'superadmin',p:'arama@2024',label:'Super Admin'}];
    qb.innerHTML=quickUsers.map(q=>`<div class="quick-btn" onclick="quickLogin('${q.u}','${q.p}')">
      <div>🔑 ${q.label}</div>
      <div style="font-size:10px;opacity:0.7">${q.u}</div>
    </div>`).join('');
  }
  // Restore session
  const session=DB.get('session');
  if(session&&session.ts&&Date.now()-session.ts<8*60*60*1000){
    const user=getUsers().find(u=>u.id===session.userId);
    if(user&&user.active){
      STATE.user=user;STATE.role=user.role;STATE.locationCode=session.locationCode;
      startApp();return;
    }
  }
}
function quickLogin(username,password){
  document.getElementById('login-username').value=username;
  document.getElementById('login-password').value=password;
  doLogin();
}
// ─── PATCH: editB2B ──────────────────────────────────────────────
function editB2B(id){
  const data=DB.get('b2b-transactions')||[];
  const d=data.find(x=>x.id===id);if(!d)return;
  modal(`<div class="modal">
    <div class="modal-header"><h3>✏️ Edit B2B Transaction</h3><button class="close-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group"><label>Company</label><input type="text" id="eb-company" value="${d.company||''}"></div>
        <div class="form-group"><label>Contact</label><input type="text" id="eb-contact" value="${d.contact||''}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>Amount (₹)</label><input type="number" id="eb-amount" value="${d.amount||0}"></div>
        <div class="form-group"><label>Date</label><input type="date" id="eb-date" value="${(d.date||d.ts||'').slice(0,10)}"></div>
      </div>
      <div class="form-group"><label>Status</label>
        <select id="eb-status">
          ${['Active','Pending','Completed','Cancelled'].map(s=>`<option${d.status===s?' selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label>Notes</label><textarea id="eb-notes" rows="3">${d.notes||''}</textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" onclick="deleteB2B('${id}')">Delete</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="updateB2B('${id}')">Save</button>
    </div>
  </div>`);
}
function updateB2B(id){
  const data=DB.get('b2b-transactions')||[];
  const idx=data.findIndex(x=>x.id===id);if(idx<0)return;
  data[idx]={...data[idx],
    company:document.getElementById('eb-company').value,
    contact:document.getElementById('eb-contact').value,
    amount:parseInt(document.getElementById('eb-amount').value)||0,
    date:document.getElementById('eb-date').value,
    status:document.getElementById('eb-status').value,
    notes:document.getElementById('eb-notes').value,
    updatedAt:new Date().toISOString()
  };
  DB.set('b2b-transactions',data);closeModal();showHistoryTab('b2b',null);toast('B2B transaction updated!','success');
}
function deleteB2B(id){
  const data=(DB.get('b2b-transactions')||[]).filter(x=>x.id!==id);
  DB.set('b2b-transactions',data);closeModal();showHistoryTab('b2b',null);toast('Deleted','info');
}
// ─── PATCH: viewReport (inline) ───────────────────────────────────
function viewReport(loc,date){
  const report=DB.get(`report_${loc}_${date}`)||{};
  const txns=(DB.get('transactions')||[]).filter(t=>t.locationCode===loc&&t.ts?.slice(0,10)===date);
  const totalRev=txns.reduce((s,t)=>s+(t.amount||0),0);
  const cashRev=txns.filter(t=>t.paymentMode==='cash').reduce((s,t)=>s+(t.amount||0),0);
  const upiRev=txns.filter(t=>t.paymentMode==='upi').reduce((s,t)=>s+(t.amount||0),0);
  const locName=getLocation(loc)?.name||loc;
  const fields=[
    {label:'Opening Chairs',key:'chairsOpening'},
    {label:'Closing Chairs',key:'chairsClosing'},
    {label:'Equipment Issues',key:'equipmentIssues'},
    {label:'Meter Open',key:'meterOpen'},
    {label:'Meter Close',key:'meterClose'},
    {label:'Staff Present',key:'staffPresent'},
    {label:'Cash Counted',key:'cashCounted'},
    {label:'Incidents',key:'incidents'},
    {label:'Remarks',key:'remarks'},
  ];
  modal(`<div class="modal modal-lg">
    <div class="modal-header">
      <div><h3>📋 Daily Report — ${locName}</h3><div style="font-size:12px;color:var(--text2)">${fmt.date(date+'T00:00:00')} · Saved by ${report.savedBy||'—'}</div></div>
      <div class="flex gap8">
        <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨️ Print</button>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="report-grid mb16">
        <div class="report-cell"><div class="report-cell-label">Total Revenue</div><div class="report-cell-value text-green">${fmt.currency(totalRev)}</div></div>
        <div class="report-cell"><div class="report-cell-label">UPI</div><div class="report-cell-value text-blue">${fmt.currency(upiRev)}</div></div>
        <div class="report-cell"><div class="report-cell-label">Cash</div><div class="report-cell-value text-gold">${fmt.currency(cashRev)}</div></div>
        <div class="report-cell"><div class="report-cell-label">Sessions</div><div class="report-cell-value">${txns.length}</div></div>
        <div class="report-cell"><div class="report-cell-label">Cash Variance</div><div class="report-cell-value" style="color:${(report.cashCounted||0)-cashRev===0?'var(--green)':Math.abs((report.cashCounted||0)-cashRev)<50?'var(--gold)':'var(--red)'}">${report.cashCounted!==undefined?fmt.currency((report.cashCounted||0)-cashRev):'Not counted'}</div></div>
        <div class="report-cell"><div class="report-cell-label">Units Used</div><div class="report-cell-value">${report.meterOpen&&report.meterClose?(report.meterClose-report.meterOpen)+' units':'—'}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
        ${fields.map(f=>`<div class="report-cell"><div class="report-cell-label">${f.label}</div><div style="font-size:13px;font-weight:600">${report[f.key]||'—'}</div></div>`).join('')}
      </div>
      <div class="report-cell mb8"><div class="report-cell-label">Housekeeping</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
          ${['Chairs cleaned','Chair covers changed','Floor mopped','Sanitizer refilled','Cleaning supplies ok','AC/Fan working'].map(item=>{
            const key='hk_'+item.replace(/\s/g,'_');
            return `<span class="badge ${report[key]?'badge-green':'badge-red'}">${report[key]?'✅':'❌'} ${item}</span>`;
          }).join('')}
        </div>
      </div>
      ${report.remarks?`<div class="alert alert-info"><strong>Staff Remarks:</strong> ${report.remarks}</div>`:''}
      ${report.incidents?`<div class="alert alert-warn"><strong>Incidents:</strong> ${report.incidents}</div>`:''}
    </div>
    <div class="modal-footer"><button class="btn btn-primary" onclick="closeModal()">Close</button></div>
  </div>`);
}

        <tbody>${users.map(u=>{
          const txns=(DB.get('transactions')||[]).filter(t=>t.staffId===u.id&&t.ts?.startsWith(thisMonth));
          const rev=txns.reduce((s,t)=>s+(t.amount||0),0);
          const tier=cfg.commissionTiers?.find(t=>rev>=t.minRev&&rev<=t.maxRev);
          const comm=tier?Math.round(rev*tier.pct/100):0;
          return `<tr><td><strong>${u.name}</strong></td><td>${getLocation(u.locationCode)?.name||u.locationCode}</td><td class="text-green">${fmt.currency(rev)}</td><td>${txns.length}</td><td><span class="badge badge-gold">${tier?.label||'—'} ${tier?'('+tier.pct+'%)':''}</span></td><td class="text-gold bold">${fmt.currency(comm)}</td></tr>`;
        }).join('')}</tbody>
      </table></div>
    </div>`;
  } else if(tab==='compliance'){
    c.innerHTML=`<div class="card">
      <div class="card-header"><h3>✅ Compliance Checklist</h3></div>
      <div style="display:grid;gap:10px">
        ${['All staff have valid ID proof on file','Labour contract signed by all staff','Weekly safety briefing conducted','Equipment maintenance log updated','Fire safety equipment checked','First aid kit stocked','Emergency contact list posted'].map((item,i)=>{
          const checked=DB.get('compliance_'+i)||false;
          return `<label style="display:flex;align-items:center;gap:12px;padding:12px;background:var(--card2);border-radius:8px;cursor:pointer;border:1px solid var(--border)">
            <input type="checkbox" ${checked?'checked':''} onchange="DB.set('compliance_${i}',this.checked)" style="width:18px;height:18px;cursor:pointer">
            <span>${item}</span>
            ${checked?'<span class="badge badge-green" style="margin-left:auto">✅ Done</span>':'<span class="badge badge-red" style="margin-left:auto">⚠️ Pending</span>'}
          </label>`;
        }).join('')}
      </div>
    </div>`;
  }
}

function saveAttendance(){
  const staffVal=document.getElementById('att-staff')?.value.split('|');
  const type=document.getElementById('att-type')?.value;
  const time=document.getElementById('att-time')?.value;
  if(!staffVal)return;
  const today=new Date().toISOString().slice(0,10);
  const ts=new Date(today+'T'+time+':00').toISOString();
  const records=DB.get('attendance')||[];
  if(type==='in'){
    records.push({id:uid(),staffId:staffVal[0],staffName:staffVal[1],locationCode:staffVal[2],date:today,checkIn:ts,checkOut:null});
  } else {
    const rec=records.filter(r=>r.staffId===staffVal[0]&&r.date===today&&!r.checkOut).pop();
    if(rec)rec.checkOut=ts;else{toast('No check-in found for today','error');return}
  }
  DB.set('attendance',records);closeModal();hrmsTab('attendance',null);toast('Attendance saved!','success');
}
function exportPayroll(){
  const users=getUsers().filter(u=>u.role==='staff'||u.role==='supervisor');
  const cfg=getConfig();const thisMonth=new Date().toISOString().slice(0,7);
  const rows=[['Name','Location','Revenue','Sessions','Tier','Commission%','Commission']];
  users.forEach(u=>{
    const txns=(DB.get('transactions')||[]).filter(t=>t.staffId===u.id&&t.ts?.startsWith(thisMonth));
    const rev=txns.reduce((s,t)=>s+(t.amount||0),0);
    const tier=cfg.commissionTiers?.find(t=>rev>=t.minRev&&rev<=t.maxRev);
    const comm=tier?Math.round(rev*tier.pct/100):0;
    rows.push([u.name,getLocation(u.locationCode)?.name||u.locationCode,rev,txns.length,tier?.label||'—',tier?.pct||0,comm]);
  });
  const csv=rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`payroll-${thisMonth}.csv`;a.click();
  toast('Payroll exported!','success');
}

function exportCSV(type){
  let rows=[];let filename='arama_'+type+'_'+new Date().toISOString().slice(0,10)+'.csv';
  const esc=v=>{const s=String(v==null?'':v);return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;};
  const row=arr=>arr.map(esc).join(',')+'\n';
  if(type==='transactions'){
    const txns=DB.get('transactions')||[];
    rows.push(row(['ID','Date','Time','Location','Service','Duration','Amount','PaymentMode','Staff','Token','LoyaltyPts','Notes']));
    txns.forEach(t=>{
      const d=new Date(t.ts||t.date||Date.now());
      rows.push(row([t.id||'',d.toLocaleDateString('en-IN'),d.toLocaleTimeString('en-IN'),t.location||'',t.service||'',t.duration||'',t.amount||0,t.paymentMode||'',t.staff||'',t.token||'',t.loyaltyPoints||0,t.notes||'']));
    });
  } else if(type==='phonepe'){
    const pp=DB.get('phonepe-records')||[];
    rows.push(row(['ID','Date','StoreID','Amount','Status','Reference','Location']));
    pp.forEach(p=>{
      const d=new Date(p.ts||p.date||Date.now());
      rows.push(row([p.id||'',d.toLocaleDateString('en-IN'),p.storeId||p.store||'',p.amount||0,p.status||'',p.ref||p.reference||'',p.location||'']));
    });
  } else if(type==='crm'){
    const leads=DB.get('crm-leads')||[];
    rows.push(row(['ID','Company','ContactName','Phone','Email','Stage','Industry','Value','Source','Notes','LastContact','Created']));
    leads.forEach(l=>{
      rows.push(row([l.id||'',l.company||'',l.contactName||l.name||'',l.phone||'',l.email||'',l.stage||'',l.industry||'',l.value||0,l.source||'',l.notes||'',l.lastContact?new Date(l.lastContact).toLocaleDateString('en-IN'):'',l.ts?new Date(l.ts).toLocaleDateString('en-IN'):'']));
    });
  } else if(type==='loyalty'){
    // Scan all loyalty keys
    const members=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith('arama_loyalty_')){
        const phone=k.replace('arama_loyalty_','');
        try{const m=JSON.parse(localStorage.getItem(k));if(m)members.push({phone,...m});}catch(e){}
      }
    }
    rows.push(row(['Phone','Name','Points','TotalSpend','Visits','JoinDate','LastVisit']));
    members.forEach(m=>{
      const hist=m.history||[];
      const lastV=hist.length?new Date(hist[hist.length-1].ts||hist[hist.length-1].date).toLocaleDateString('en-IN'):'';
      rows.push(row([m.phone||'',m.name||'',m.points||0,m.totalSpend||0,hist.length,m.joinDate?new Date(m.joinDate).toLocaleDateString('en-IN'):'',lastV]));
    });
  } else if(type==='daily-reports'){
    const rpts=DB.get('daily-reports')||[];
    rows.push(row(['Date','Location','ShiftType','TotalRevenue','ChairRevenue','LegRevenue','GunRevenue','ComboRevenue','PhonePeAmount','CashAmount','ChairSessions','TotalSessions','MeterReading','StaffPresent','Incidents','Notes','SubmittedBy','SubmittedAt']));
    rpts.forEach(r=>{
      rows.push(row([r.date||'',r.location||'',r.shiftType||'',r.totalRevenue||0,r.chairRevenue||0,r.legRevenue||0,r.gunRevenue||0,r.comboRevenue||0,r.phonePeAmount||0,r.cashAmount||0,r.chairSessions||0,r.totalSessions||0,r.meterReading||'',r.staffPresent||'',r.incidents||'',r.notes||'',r.submittedBy||'',r.submittedAt?new Date(r.submittedAt).toLocaleString('en-IN'):'']));
    });
  } else if(type==='users'){
    const users=DB.get('users')||[];
    rows.push(row(['ID','Name','Username','Role','RoleLevel','Location','Phone','Email','Status','JoinDate']));
    users.forEach(u=>{
      if(u.username==='superadmin')return; // skip superadmin for security
      rows.push(row([u.id||'',u.name||'',u.username||'',u.role||'',u.roleLevel||'',u.location||'',u.phone||'',u.email||'',u.active===false?'Inactive':'Active',u.createdAt?new Date(u.createdAt).toLocaleDateString('en-IN'):'']));
    });
  }
  if(rows.length<=1){showToast('No data found to export for: '+type,'warning');return;}
  const csv=rows.join('');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}); // BOM for Excel
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  URL.revokeObjectURL(url);
  showToast('Exported '+String(rows.length-1)+' rows to '+filename,'success');
}

async function pushToSheets(type){
  const url=DB.get('sheets-webhook-url');
  if(!url){showToast('Save your Apps Script webhook URL first in the Backup tab','error');return;}
  let data=[];
  if(type==='transactions')data=DB.get('transactions')||[];
  else if(type==='crm')data=DB.get('crm-leads')||[];
  else if(type==='daily-reports')data=DB.get('daily-reports')||[];
  else if(type==='loyalty'){
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('arama_loyalty_')){try{const m=JSON.parse(localStorage.getItem(k));if(m)data.push({phone:k.replace('arama_loyalty_',''),...m});}catch(e){}}}
  }
  if(!data.length){showToast('No data to push for: '+type,'warning');return;}
  showToast('Pushing to Google Sheets…','info');
  try{
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,data,ts:new Date().toISOString()}),signal:AbortSignal.timeout(10000)});
    if(res.ok){showToast('Pushed '+data.length+' records to Sheets ✓','success');}
    else{showToast('Sheets push failed: HTTP '+res.status,'error');}
  }catch(e){showToast('Could not reach the Apps Script URL. Check the URL and redeploy.','error');}
}
